name: Build TropiCalc

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Inspection temporaire des classes de combat Cobblemon
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle .gradle -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'com/cobblemon/mod/common/client/battle/ClientBattle.class'; then JAR="$j"; break; fi
          done
          echo "jar: $JAR" > inspection.txt
          for c in com.cobblemon.mod.common.client.battle.ClientBattle \
                   com.cobblemon.mod.common.client.battle.ClientBattlePokemon \
                   com.cobblemon.mod.common.client.battle.ClientBattleActor \
                   com.cobblemon.mod.common.client.battle.ActiveClientBattlePokemon \
                   com.cobblemon.mod.common.battles.ShowdownActionRequest \
                   com.cobblemon.mod.common.battles.ShowdownMoveset \
                   com.cobblemon.mod.common.battles.InBattleMove \
                   com.cobblemon.mod.common.client.battle.SingleActionRequest; do
            echo "===== $c" >> inspection.txt
            javap -cp "$JAR" "$c" >> inspection.txt 2>&1 || true
          done
          unzip -l "$JAR" | grep -i "battle.*Request\|Moveset\|InBattleMove" >> inspection.txt || true
          git config user.name ci-log
          git config user.email ci@log
          git stash -u -q || true
          git checkout -q --orphan ci-inspection
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          git stash pop -q || true
          git add -f inspection.txt
          git commit -q -m "inspection $GITHUB_SHA"
          git push -f -q origin HEAD:ci-log
          git checkout -q -f $GITHUB_SHA
        shell: bash

      - name: Pousser le log en cas d'échec
        if: failure()
        run: |
          git config user.name ci-log
          git config user.email ci@log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f build-output.log
          git commit -q -m "log de build $GITHUB_SHA"
          git push -f origin ci-log
        shell: bash

      - name: Publier les erreurs dans le résumé
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|FAILED|What went wrong|Caused by|Could not|Écart|Showdown  :|TropiCalc :" build-output.log | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '---- tail ----' >> $GITHUB_STEP_SUMMARY
          tail -30 build-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tropicalc-build
          path: build/libs/*.jar
